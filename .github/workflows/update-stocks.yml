name: Update Stock Prices

on:
  schedule:
    # Every day at 06:17 UTC, after the US close and before Europe opens.
    # (Off the hour on purpose: GitHub delays jobs scheduled at :00 by hours.)
    - cron: '17 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install --no-save @google/generative-ai
          
      - name: Update stock data
        env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Market data from Yahoo Finance (same source as the live /api/quotes);
        # Gemini + Google Search only if Yahoo can't be reached.
        run: node scripts/updateStocks.js || node scripts/updateStocksGemini.js
        
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Working tree status before commit:"
          git status --porcelain
          git add src/data/stockData.json
          if git diff --staged --quiet; then
            echo "No stock data changes to commit."
          else
            git commit -m "Update stock prices - $(date +'%Y-%m-%d')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
